name: Publish Ubuntu OVAL reference

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-ubuntu-oval.yaml'
      - 'powerbi/ubuntu-oval/prepare_ubuntu_oval.py'
      - 'powerbi/ubuntu-oval/tests/**'

permissions:
  contents: read

concurrency:
  group: publish-ubuntu-oval
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'chrisdoofer/arc-sql-agent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test preparation
        run: |
          python -m unittest discover -s powerbi/ubuntu-oval/tests -p test_prepare_ubuntu_oval.py -v
          node --test powerbi/ubuntu-oval/tests/test_publish_ubuntu_oval.js

      - name: Prepare all supported releases
        run: python powerbi/ubuntu-oval/prepare_ubuntu_oval.py --output "${{ runner.temp }}/ubuntu-usn-oval.json"

      - name: Publish one atomic reference update
        uses: actions/github-script@v7
        env:
          SNAPSHOT_PATH: ${{ runner.temp }}/ubuntu-usn-oval.json
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const branch = 'ubuntu-oval-data';
            const path = 'ubuntu-usn-oval.json';
            const content = fs.readFileSync(process.env.SNAPSHOT_PATH);
            const snapshot = JSON.parse(content.toString('utf8'));
            const age = Date.now() - Date.parse(snapshot.generated_at);
            if (snapshot.schema_version !== 1 || !Number.isFinite(age) ||
                age < -600000 || age > 3600000 ||
                !['noble', 'jammy', 'focal'].every(release =>
                  Array.isArray(snapshot.notices?.[release]) &&
                  snapshot.notices[release].length > 0 &&
                  snapshot.sources?.filter(source => source.release === release).length === 1) ||
                !snapshot.cves || Object.keys(snapshot.cves).length === 0) {
              throw new Error('Refusing to publish an invalid or stale OVAL snapshot.');
            }
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              const { data: source } = await github.rest.git.getRef({
                owner, repo, ref: 'heads/main'
              });
              await github.rest.git.createRef({
                owner, repo, ref: `refs/heads/${branch}`, sha: source.object.sha
              });
            }
            let sha;
            try {
              const { data } = await github.rest.repos.getContent({
                owner, repo, path, ref: branch,
                mediaType: { format: 'object' }
              });
              if (Array.isArray(data) || data.type !== 'file') {
                throw new Error('The publication path is not a file.');
              }
              sha = data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, branch, path, sha,
              message: `Refresh public Ubuntu USN OVAL reference (${snapshot.generated_at})`,
              content: content.toString('base64')
            });
            await core.summary
              .addHeading('Ubuntu OVAL reference published')
              .addRaw(`Prepared: ${snapshot.generated_at}\n\n`)
              .addRaw(`CVEs: ${Object.keys(snapshot.cves).length}\n\n`)
              .addLink('Public reference', `https://raw.githubusercontent.com/${owner}/${repo}/refs/heads/${branch}/${path}`)
              .write();
